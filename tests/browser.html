<!doctype html><html><meta charset="utf-8"><title>留名浏览器检查</title><body><iframe id="app" src="../index.html" style="width:390px;height:820px"></iframe><pre id="result">等待检查</pre><script>
document.getElementById('app').onload=async()=>{const w=document.getElementById('app').contentWindow;const checks=[];try{const o={author:'小红书 @测试老师',opacity:.22,popup:true,message:'请保留署名',readonly:true};const h=w.injectHTML('<html><head></head><body><b>原卡片</b></body></html>',o);const d=new DOMParser().parseFromString(h,'text/html');if(!d.querySelector('span[aria-label="作者署名"]'))throw Error('HTML 水印失败');checks.push('HTML 输出结构通过');const reader=w.markdown('# 标题\n原始文本',o,true);if(!reader.includes('# 标题'))throw Error('MD 失败');checks.push('MD 阅读版通过');await w.library('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',()=>!!w.PDFLib);const p=await w.PDFLib.PDFDocument.create();p.addPage([595,842]);const before=await p.save(),after=await w.watermarkPDF(before,o);const out=await w.PDFLib.PDFDocument.load(after);if(out.getPageCount()!==1||out.getAuthor()!==o.author)throw Error('PDF 失败');checks.push('PDF 生成、重开、作者元数据通过');await w.library('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',()=>!!w.JSZip);const z=new w.JSZip();z.file('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('word/document.xml','<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>测试正文</w:t></w:r></w:p><w:sectPr/></w:body></w:document>');const b=await w.watermarkWord(await z.generateAsync({type:'uint8array'}),o);const zz=await w.JSZip.loadAsync(b);if(!(await zz.file('word/document.xml').async('string')).includes('测试正文'))throw Error('Word 正文丢失');if(!(await zz.file('word/settings.xml').async('string')).includes('readOnly'))throw Error('Word 只读设置失败');checks.push('DOCX 正文、页眉生成、只读设置通过');document.getElementById('result').textContent='PASS\n'+checks.join('\n');}catch(e){document.getElementById('result').textContent='FAIL\n'+checks.join('\n')+'\n'+e.message;}};
</script></body></html>
